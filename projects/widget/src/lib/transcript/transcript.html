@let _transcript = transcript$ | async;
<div class="transcript">
  @for (utterance of _transcript; track utterance) {
    <lib-utterance [utterance]="utterance"></lib-utterance>
  }
  @let typing = typing$ | async;
  @if (typing) {
    <div class="loader">
      <span></span>
      <span></span>
      <span></span>
    </div>
  }
</div>
