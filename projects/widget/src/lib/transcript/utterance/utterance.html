@if (utterance) {
  @if (utterance.participant === "agent") {
    <div class="flex items-center text-xs mb-1">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
        stroke-width="1.5"
        stroke="currentColor"
        class="size-4"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M17.982 18.725A7.488 7.488 0 0 0 12 15.75a7.488 7.488 0 0 0-5.982 2.975m11.963 0a9 9 0 1 0-11.963 0m11.963 0A8.966 8.966 0 0 1 12 21a8.966 8.966 0 0 1-5.982-2.275M15 9.75a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"
        />
      </svg>
      <span class="ml-1">Agent</span>
    </div>
  }
  <div [class]="'ut--' + utterance.participant + ''">
    <div
      [class]="
        'p-2 border border-gray-300 rounded-md' +
        ' bg-' +
        utterance.participant +
        ' rounded-' +
        utterance.participant
      "
    >
      <span>
        {{ utterance.text }}
      </span>
    </div>
  </div>
  @if (utterance.participant === "agent") {
    <span class="text-xs/2 text-gray-500">{{
      utterance.timestamp | date: "dd/MM/yyyy HH:mm"
    }}</span>
  }
}
